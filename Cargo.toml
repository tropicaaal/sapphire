[package]
name = "sapphire-discord-bot"
version = "0.1.0"
edition = "2024"
authors = ["Tropical <42101043+tropicaaal@users.noreply.github.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = { version = "0.8" }
markov_str = "0.3.0"
rand = { version = "0.8.8", features = ["std_rng"] }
getrandom = { version = "0.2", features = ["js"] }
regex = { version = "1.11.3", features = ["unicode"] }
twilight-model = "0.17.1"
log = "0.4.34"
console_log = "1.1.0"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
